name: CI/CD Pipeline & EC2 Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment to EC2'
        required: false
        default: 'false'

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI Validation: Test and Build Backend, Frontend, and Docker Syntax
  # ============================================================================
  test-and-build:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Test Spring Boot Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean verify -B

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, Test & Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f infrastructure/docker-compose.yml config

  # ============================================================================
  # 2. CD Deployment: Connect to AWS EC2 via SSH and Deploy Safely
  # ============================================================================
  deploy:
    name: Deploy to EC2 (CD)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "=================================================="
            echo "Starting SmartDoorLight Deployment on EC2 Server"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=================================================="

            APP_DIR="$HOME/smart-door"

            # 1. Clone repository if not present, otherwise fetch latest code
            if [ ! -d "$APP_DIR/.git" ]; then
              echo ">>> Initial repository setup: cloning Jestin-16/smart-door..."
              git clone https://github.com/jestin-16/smart-door.git "$APP_DIR"
              cd "$APP_DIR"
            else
              echo ">>> Existing repository found at $APP_DIR. Fetching latest changes..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # 2. Run the idempotent automated deployment script
            chmod +x infrastructure/*.sh
            bash infrastructure/deploy_on_ec2.sh
