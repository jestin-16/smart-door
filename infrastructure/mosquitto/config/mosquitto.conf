# Eclipse Mosquitto Configuration for SmartDoorLight IoT System

# Standard authenticated MQTT listener
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl_file

# Modular configuration directory for optional features (e.g. TLS listeners on port 8883)
include_dir /mosquitto/config/conf.d

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
