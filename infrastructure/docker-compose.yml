version: '3.8'

services:
  # Eclipse Mosquitto MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: smartdoor-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL 16 Database
  postgres-db:
    image: postgres:16-alpine
    container_name: smartdoor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdoor_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartdoor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdoor_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdoor_user} -d ${POSTGRES_DB:-smartdoor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
