# ==============================================================================
# SmartDoorLight — Production-Oriented Multi-Service Docker Compose Architecture
# Optimized for AWS EC2 t3.small (2 vCPU, 2 GiB RAM) Ubuntu 24.04 LTS
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database Service
  # Strictly internal to Docker network; NEVER exposed to public host port 5432!
  # ----------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: smartdoor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdoor_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartdoor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdoor_secure_pass}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - smartdoor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdoor_user} -d ${POSTGRES_DB:-smartdoor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. Eclipse Mosquitto 2.0 MQTT Broker Service
  # Enforces authentication, ACLs, and persistent telemetry/event logging.
  # ----------------------------------------------------------------------------
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: smartdoor-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/password_file:/mosquitto/config/password_file:ro
      - ./mosquitto/config/acl_file:/mosquitto/config/acl_file:ro
      - ./mosquitto/config/conf.d:/mosquitto/config/conf.d:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - smartdoor-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u ${MQTT_BACKEND_USER:-smartdoor_backend} -P ${MQTT_BACKEND_PASSWORD:-backend_secure_mqtt_pass} -t '$$SYS/broker/version' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M

  # ----------------------------------------------------------------------------
  # 3. Spring Boot 4 / Java 21 Backend Service
  # Communicates internally with PostgreSQL and Mosquitto over Docker network.
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: smartdoor-backend:latest
    container_name: smartdoor-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-smartdoor_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartdoor_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartdoor_secure_pass}
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_CLIENT_ID: smartdoor-backend
      MQTT_USERNAME: ${MQTT_BACKEND_USER:-smartdoor_backend}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-backend_secure_mqtt_pass}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://15.252.238.128,http://localhost:5173,http://localhost:3000}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=40.0 -Xmx384m -Xms128m}
    expose:
      - "8080"
    networks:
      - smartdoor-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. React 19 / Vite Frontend SPA served by Nginx
  # Reverse proxies /api/ requests to the backend container over internal network.
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: smartdoor-frontend:latest
    container_name: smartdoor-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartdoor-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M

# ------------------------------------------------------------------------------
# Isolated Internal Docker Bridge Network
# ------------------------------------------------------------------------------
networks:
  smartdoor-net:
    driver: bridge
    name: smartdoor-network

# ------------------------------------------------------------------------------
# Persistent Data Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres-data:
    name: smartdoor-postgres-data
  mosquitto-data:
    name: smartdoor-mosquitto-data
  mosquitto-log:
    name: smartdoor-mosquitto-log
