<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="sdFavBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d5635"/>
      <stop offset="100%" stop-color="#243820"/>
    </linearGradient>

    <!-- Warm golden ambient light spill -->
    <linearGradient id="sdFavSpill" x1="22" y1="20" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6cc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f7cb63" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Door Leaf Gradient -->
    <linearGradient id="sdFavDoor" x1="18" y1="18" x2="33" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7e9c70"/>
      <stop offset="100%" stop-color="#557347"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Icon -->
  <rect width="64" height="64" rx="16" fill="url(#sdFavBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#779669" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Warm Light Spill radiating from interior chamber -->
  <polygon points="22,17 50,11 54,53 22,49" fill="url(#sdFavSpill)"/>

  <!-- Interior Door Cavity Shadow -->
  <rect x="20" y="15" width="24" height="36" rx="2" fill="#182315" fill-opacity="0.75"/>

  <!-- Swung Open Door Leaf (3D perspective) -->
  <polygon points="20,15 33,19 33,47 20,51" fill="url(#sdFavDoor)" stroke="#324928" stroke-width="1"/>
  <line x1="24" y1="19" x2="24" y2="47" stroke="#90ad82" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- Brass Handle with warm gleam -->
  <circle cx="31" cy="33" r="1.5" fill="#ffeaa7"/>
  <line x1="29.5" y1="33" x2="31.5" y2="33" stroke="#fff9db" stroke-width="1" stroke-linecap="round"/>

  <!-- Architectural Door Outer Trim -->
  <rect x="17" y="13" width="30" height="40" rx="3" fill="none" stroke="#f0f5eb" stroke-width="2.5"/>
  <line x1="14" y1="53" x2="50" y2="53" stroke="#cbd8c2" stroke-width="2" stroke-linecap="round"/>

  <!-- Smart IoT Light Fixture & Wi-Fi Node on Header -->
  <circle cx="32" cy="9" r="2" fill="#ffe082"/>
  <circle cx="32" cy="9" r="4.5" stroke="#ffe082" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="1 2"/>

  <!-- Smart Wave Beams -->
  <path d="M 40 18 A 6 6 0 0 1 45 23" fill="none" stroke="#ffeb99" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M 43 15 A 10 10 0 0 1 50 22" fill="none" stroke="#ffeb99" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
