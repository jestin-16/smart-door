server:
  port: 8080

spring:
  application:
    name: smartdoor-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartdoor_db}
    username: ${SPRING_DATASOURCE_USERNAME:smartdoor_user}
    password: ${SPRING_DATASOURCE_PASSWORD:smartdoor_secure_pass}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# MQTT Broker Configuration
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:smartdoor-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic-prefix: smartdoor/device/
  default-device-id: smartdoor-01
  auto-reconnect: true
  connection-timeout: 10
  keep-alive-interval: 30

# CORS settings for React Vite frontend
cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:5173"

# OpenAPI Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
