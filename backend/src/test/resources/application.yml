server:
  port: 0

spring:
  application:
    name: smartdoor-backend-test
  datasource:
    url: jdbc:h2:mem:smartdoor_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

mqtt:
  broker-url: tcp://localhost:1883
  client-id: smartdoor-backend-test
  topic-prefix: smartdoor/device/
  default-device-id: smartdoor-01
  enabled: false

cors:
  allowed-origins:
    - "*"
